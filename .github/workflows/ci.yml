name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege at the top; the image job widens it for itself only.
permissions:
  contents: read

# One run per ref: a force-push supersedes the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test server/test
      - run: cd cli && bun run build && bun run test:e2e

  images:
    # Publishes, using the workflow's own GITHUB_TOKEN — no PAT anywhere:
    #   stepaway-server  :<version from server/package.json> + :latest
    #                     on every push (branch main and v* tags)
    #   stepaway-builder :<sha> + :latest, main only. This is the image of the
    #                     k8s Job that builds a session's devcontainer
    #                     environment; the chart passes it as BUILDER_IMAGE.
    #
    # The two differ only in context/dockerfile/tag, so they share one matrix
    # job. `matrix` is not available in a job-level `if`, so the main-only rule
    # for the builder lives on the publish steps instead: the builder's matrix
    # leg still spins up on tag pushes, it just does not build or push.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: stepaway-server
            context: .
            dockerfile: server/Dockerfile
            main_only: false
          - name: builder
            image: stepaway-builder
            context: builder
            dockerfile: builder/Dockerfile
            main_only: true
    steps:
      - uses: actions/checkout@v4
      - id: gate
        # `publish` is the per-image equivalent of the old job-level `if`.
        run: |
          if [ "${{ matrix.main_only }}" = "true" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - id: tag
        if: steps.gate.outputs.publish == 'true'
        # server is versioned from its package.json; builder is content-addressed
        # by commit. Both also move :latest.
        run: |
          if [ "${{ matrix.name }}" = "server" ]; then
            echo "value=$(jq -r .version server/package.json)" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.publish == 'true'
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

  feature:
    # Publishes the devcontainer Feature as an OCI artifact under
    # ghcr.io/<owner>/stepaway-feature/stepaway (version from
    # feature/src/stepaway/devcontainer-feature.json). The builder merges it
    # into every devcontainer build; it is also usable standalone.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: feature/src
          oci-registry: ghcr.io
          features-namespace: ${{ github.repository_owner }}/stepaway-feature
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
