name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege at the top; the image job widens it for itself only.
permissions:
  contents: read

# One run per ref: a force-push supersedes the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test server/test
      - run: cd cli && bun run build && bun run test:e2e

  image:
    # Publishes ghcr.io/<owner>/stepaway-server:<version> (+ latest) using the
    # workflow's own GITHUB_TOKEN — no PAT anywhere.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(jq -r .version server/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/stepaway-server:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/stepaway-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

  builder-image:
    # Publishes ghcr.io/<owner>/stepaway-builder:latest (+ :<sha>). This is the
    # image of the k8s Job that builds a session's devcontainer environment;
    # the chart passes it to the backend as BUILDER_IMAGE.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: builder
          file: builder/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/stepaway-builder:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/stepaway-builder:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

  feature:
    # Publishes the devcontainer Feature as an OCI artifact under
    # ghcr.io/<owner>/stepaway-feature/stepaway (version from
    # feature/src/stepaway/devcontainer-feature.json). The builder merges it
    # into every devcontainer build; it is also usable standalone.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: feature/src
          oci-registry: ghcr.io
          features-namespace: ${{ github.repository_owner }}/stepaway-feature
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
