apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stepaway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stepaway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stepaway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stepaway.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "stepaway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stepaway
          image: {{ include "stepaway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: STEPAWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "stepaway.authSecretName" . }}
                  key: token
            - name: RUNNER_IMAGE
              value: {{ .Values.runner.image | quote }}
            - name: RUNNER_CPU_REQUEST
              value: {{ .Values.runner.resources.cpuRequest | quote }}
            - name: RUNNER_MEM_REQUEST
              value: {{ .Values.runner.resources.memRequest | quote }}
            - name: RUNNER_MEM_LIMIT
              value: {{ .Values.runner.resources.memLimit | quote }}
            - name: RUNNER_STORAGE_CLASS
              value: {{ .Values.runner.storageClass | quote }}
            - name: RUNNER_PVC_SIZE
              value: {{ .Values.runner.pvc.size | quote }}
            - name: RUNNER_DIND_ENABLED
              value: {{ .Values.runner.dind.enabled | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
