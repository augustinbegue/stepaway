{{- if .Values.registry.enabled }}
{{- $host := required "registry.host is REQUIRED when registry.enabled=true: session images are pulled by kubelets, which cannot resolve cluster DNS names (see values.yaml)." .Values.registry.host -}}
{{- $secretName := .Values.registry.auth.secretName -}}
{{- /* registry.extraVolumes references the auth Secret by literal name (Helm
       cannot template subchart values), so the two must agree. */ -}}
{{- range .Values.registry.extraVolumes }}
{{- if and .secret (ne .secret.secretName $secretName) }}
{{- fail (printf "registry.extraVolumes references Secret %q but registry.auth.secretName is %q — keep them in sync" .secret.secretName $secretName) }}
{{- end }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $user := "stepaway" -}}
{{- $pass := "" -}}
{{- $htpasswd := "" -}}
{{- if and $existing (not .Values.registry.auth.regeneratePassword) }}
{{- $pass = index $existing.data "password" | b64dec }}
{{- $htpasswd = index $existing.data "htpasswd" | b64dec }}
{{- else }}
{{- $pass = randAlphaNum 32 }}
{{- /* sprig's htpasswd emits "user:<bcrypt>", exactly the line the registry's
       htpasswd auth backend expects. */ -}}
{{- $htpasswd = htpasswd $user $pass }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stepaway.labels" . | nindent 4 }}
  annotations:
    # Same pattern as the bearer token: `lookup` preserves the value across
    # upgrades unless registry.auth.regeneratePassword is set. Rotating it
    # invalidates cached docker logins in running build Jobs.
    # regeneratePassword only rewrites the Secret: the registry reads
    # /auth/htpasswd at startup, so the new password does not take effect until
    # the registry pod is restarted (kubectl rollout restart deploy/<registry>).
    stepaway.dev/password-source: generated
type: Opaque
data:
  username: {{ $user | b64enc }}
  password: {{ $pass | b64enc }}
  htpasswd: {{ $htpasswd | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  # FROZEN NAME (registry.pullSecretName): the backend receives it as
  # REGISTRY_PULL_SECRET and puts it in every session pod's imagePullSecrets.
  name: {{ .Values.registry.pullSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stepaway.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{%q:{\"username\":%q,\"password\":%q,\"auth\":%q}}}" $host $user $pass (printf "%s:%s" $user $pass | b64enc) | b64enc }}
{{- end }}
