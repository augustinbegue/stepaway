{{- $fullName := include "stepaway.fullname" . -}}
{{- $secretName := include "stepaway.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := "" -}}
{{- if .Values.auth.token }}
{{- $token = .Values.auth.token }}
{{- else if and $existing (not .Values.auth.regenerateToken) }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stepaway.labels" . | nindent 4 }}
  annotations:
    # helm3 `lookup` runs client-side at template time, so this Secret is a
    # normal managed release object; we just avoid clobbering `token` on
    # upgrade unless auth.regenerateToken is set (see logic above).
    stepaway.dev/token-source: {{ if .Values.auth.token }}values{{ else }}generated{{ end }}
type: Opaque
data:
  token: {{ $token | b64enc }}
