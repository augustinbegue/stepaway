# Default values for the stepaway chart.
# See README.md for the full values reference.

# -- Number of backend replicas. The backend is stateful-ish (in-memory
# session bookkeeping is backed by k8s objects), keep this at 1 unless you
# know what you're doing.
replicaCount: 1

image:
  # -- Backend container image repository.
  repository: ghcr.io/augustinbegue/stepaway-server
  pullPolicy: IfNotPresent
  # -- Backend image tag. Defaults to the chart's appVersion when empty.
  tag: ""

imagePullSecrets: []

# -- Extra labels applied to every object this chart renders, in addition to
# the standard app.kubernetes.io/* labels and app.kubernetes.io/part-of: stepaway.
extraLabels: {}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a ServiceAccount for the backend. The backend needs
  # this identity to create/manage session pods via the k8s API.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  # -- Service port. Always proxies to the backend's PORT 8080.
  port: 80

resources:
  # -- Resources for the backend Deployment. Left empty by default; set
  # explicit requests/limits before running this in a resource-constrained
  # cluster.
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# -- Extra environment variables merged into the backend container, after the
# ones this chart sets (STEPAWAY_TOKEN, PORT, RUNNER_*). Use for things like
# log level.
extraEnv: []

probes:
  # -- Path used for both liveness and readiness probes.
  path: /v1/healthz
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

auth:
  # -- Hard-set the bearer token instead of letting the chart generate one.
  # NOT RECOMMENDED: prefer the auto-generated token (see NOTES.txt after
  # install for how to read it). Only useful for GitOps setups that need a
  # deterministic value.
  token: ""
  # -- Force regeneration of the bearer token on the next `helm upgrade`.
  # Normally the chart preserves the existing token across upgrades so
  # already-authenticated CLIs keep working.
  regenerateToken: false

ingress:
  # -- Expose the backend outside the cluster. Off by default: most
  # installs are reached via `kubectl port-forward` or an internal mesh.
  enabled: false
  className: ""
  annotations: {}
  host: stepaway.example.com
  tls:
    # -- Name of a pre-existing TLS Secret in this namespace. Leave empty to
    # serve the Ingress without TLS.
    secretName: ""

# -- Passed to the backend as RUNNER_* environment variables (see
# server/src/config.ts: RUNNER_ENV_NAMES, which a test keeps in sync with the
# Deployment template). The backend applies them when it builds each
# per-session runner pod; nothing here is rendered into an object owned by
# this chart (no CRDs, no operator — session pods are created imperatively by
# the backend).
runner:
  # Fallback image when a session has no explicit image and no devcontainer
  # (docs/architecture/environment-build.md). It installs claude/bun/compose at
  # boot (~60-90s). Projects that want fast starts add a devcontainer.json —
  # the built env image is cached in the registry and boots in seconds.
  image: node:22-bookworm-slim
  resources:
    cpuRequest: 250m
    memRequest: 512Mi
    memLimit: 2Gi
  # -- StorageClass for the per-session PVC. Empty = the backend default
  # ("longhorn"); set it to your cluster's class.
  storageClass: ""
  pvc:
    # -- Size of the per-session PVC (holds the git dir, not the work tree).
    size: 5Gi
  dind:
    # -- Docker-in-Docker sidecar in every runner pod. Set to false on
    # clusters that refuse privileged containers: runners then have no docker
    # daemon, so `stepaway doctor` reports dind as failing and captures that
    # carried a compose project cannot restore it.
    enabled: true

# -- Opt-in governance for session (runner) pods. Everything here is
# disabled by default so a fresh install behaves like the v0.1 PoC: no
# quotas, no LimitRange, no NetworkPolicy.
quotas:
  enabled: false
  # -- Max number of pods (backend + runners) counted by this ResourceQuota.
  maxPods: "10"
  # -- Max number of PersistentVolumeClaims in the namespace.
  maxPVCs: "10"
  requests:
    cpu: "4"
    memory: 8Gi

limitRange:
  enabled: false
  # -- Applied to containers in runner pods that don't set their own
  # requests/limits.
  default:
    cpu: 500m
    memory: 1Gi
  defaultRequest:
    cpu: 250m
    memory: 512Mi
  # -- Hard ceiling any runner container may request/limit to.
  max:
    cpu: "4"
    memory: 8Gi

networkPolicy:
  # -- Deny-by-default ingress for runner pods (only the backend may reach
  # them) plus an open-ingress policy for the backend itself. WARNING: many
  # CNIs (e.g. flannel without a policy engine) silently no-op
  # NetworkPolicy objects — verify enforcement before relying on this for
  # isolation. See README.md.
  enabled: false
  # -- Egress rules for runner pods, passed through verbatim into the
  # NetworkPolicy spec.egress list. Empty means "egress open" (no egress
  # rule is added, so the policy only restricts ingress). Example to
  # restrict runners to DNS + private ranges is documented in README.md.
  runnerEgress: []

# -- Image of the build Job the backend creates on an env-image cache miss
# (see registry.* below). Only used when registry.enabled=true.
builder:
  image: ghcr.io/augustinbegue/stepaway-builder:latest

# In-cluster OCI registry for devcontainer environment images (SPEC-v0.3).
#
# This whole block is the values surface of the `docker-registry` subchart
# (twuni), aliased to `registry` — anything documented at
# https://github.com/twuni/docker-registry.helm can be set here. The keys
# stepaway itself reads are `enabled`, `host` and `expose` (the subchart
# ignores those three).
#
# When enabled, the chart:
#   - mints a random `stepaway` user/password in Secret
#     <registry.auth.secretName> (preserved across upgrades) and wires it into
#     the registry as htpasswd auth,
#   - creates a dockerconfigjson Secret <registry.pullSecretName> used as an
#     imagePullSecret on session pods,
#   - renders an Ingress for `registry.host`,
#   - sets REGISTRY_HOST / REGISTRY_USER / REGISTRY_PASS /
#     REGISTRY_PULL_SECRET / BUILDER_IMAGE on the backend.
# When disabled, none of that is rendered and the backend sees no
# REGISTRY_HOST, which turns the devcontainer path off (sessions fall back to
# an explicit image or the generic base).
registry:
  enabled: false

  # -- REQUIRED when registry.enabled=true. Public DNS name of the registry,
  # host[:port], no scheme (e.g. registry.stepaway.dev).
  #
  # WHY A REAL DNS NAME AND NOT A CLUSTER SERVICE NAME: the pull of a session's
  # env image is done by the *kubelet*, not by a pod. Kubelets run on the node
  # host, outside the cluster DNS search path and outside the pod network, so
  # `stepaway-registry.<ns>.svc.cluster.local:5000` is not resolvable/pullable
  # for them. The supported topology is therefore: a name that resolves for the
  # nodes, served over TLS by your ingress controller (cert-manager or any
  # pre-created TLS Secret). A node-local /etc/hosts entry or an
  # insecure-registry containerd config also works, but is on you.
  host: ""

  # Ingress rendered by stepaway (not by the subchart) so that the host is
  # taken from registry.host and stays a single source of truth.
  expose:
    # -- Render an Ingress for registry.host. Turn this off only if you expose
    # the registry some other way (LoadBalancer, node-local mirror...).
    enabled: true
    className: ""
    annotations: {}
    tls:
      # -- Name of a TLS Secret for registry.host (cert-manager or
      # pre-created). Empty = no TLS block, which almost never works: docker
      # refuses plain-HTTP registries unless every node opts in.
      secretName: ""

  # -- Name of the Secret holding the registry credentials: keys `username`,
  # `password` (plaintext, consumed by the backend and the build Jobs) and
  # `htpasswd` (bcrypt line, mounted into the registry). Preserved across
  # upgrades via lookup(), like the backend bearer token.
  auth:
    secretName: stepaway-registry-auth
    # -- Force a new registry password on the next upgrade.
    regeneratePassword: false

  # -- Name of the dockerconfigjson Secret used as imagePullSecret on session
  # pods. FROZEN: the backend receives this name as REGISTRY_PULL_SECRET.
  pullSecretName: stepaway-registry-pull

  # --- subchart values below (docker-registry) ------------------------------

  persistence:
    enabled: true
    size: 20Gi
    # -- StorageClass for the registry PVC. Empty = cluster default.
    storageClass: ""
    accessMode: ReadWriteOnce
    # -- Needed for `registry garbage-collect --delete-untagged` to reclaim
    # space; GC itself is a manual op (see README).
    deleteEnabled: true

  # The subchart's own Ingress stays off: stepaway renders it from
  # registry.host (see registry.expose above).
  ingress:
    enabled: false

  # Auth is wired from <registry.auth.secretName> instead of the subchart's
  # `secrets.htpasswd` value, because the password is generated at render time
  # and Helm cannot template subchart values.
  secrets:
    htpasswd: ""
  extraEnvVars:
    - name: REGISTRY_AUTH
      value: htpasswd
    - name: REGISTRY_AUTH_HTPASSWD_REALM
      value: stepaway
    - name: REGISTRY_AUTH_HTPASSWD_PATH
      value: /auth/htpasswd
  extraVolumes:
    - name: stepaway-registry-auth
      secret:
        secretName: stepaway-registry-auth
        items:
          - key: htpasswd
            path: htpasswd
  extraVolumeMounts:
    - name: stepaway-registry-auth
      mountPath: /auth
      readOnly: true
